<body class="p-4 md:p-8">

  <!-- Header -->
  <header class="max-w-6xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-morandi-primary" id="ui-title">Auckland English Hub</h1>
      <p class="text-sm text-gray-500 mt-1" id="ui-subtitle">奥克兰免费及社区英语活动纵向时段课表</p>
    </div>
    
    <div class="flex flex-wrap items-center gap-2">
      <!-- 语言切换按钮 -->
      <button onclick="toggleLanguage()" id="langBtn" class="bg-morandi-accent text-white px-3 py-2 rounded-lg text-sm hover:opacity-90 transition font-bold">
        🌐 English
      </button>
      <button onclick="exportToICS()" class="bg-morandi-primary text-white px-3 py-2 rounded-lg text-sm hover:opacity-90">📅 <span id="btn-ics">导出日历 (.ics)</span></button>
      <button onclick="exportToImage()" class="bg-morandi-blue text-white px-3 py-2 rounded-lg text-sm hover:opacity-90">📷 <span id="btn-img">导出图片</span></button>
      <button onclick="exportToPDF()" class="bg-morandi-purple text-white px-3 py-2 rounded-lg text-sm hover:opacity-90">📄 <span id="btn-pdf">导出 PDF</span></button>
    </div>
  </header>

  <!-- 地点与行程估算模块（支持公交与自驾预估） -->
  <section class="max-w-6xl mx-auto bg-white p-4 rounded-xl card-shadow mb-6 border-l-4 border-morandi-accent">
    <h2 class="text-base font-bold text-gray-800 mb-2 flex items-center gap-2">
      <span>🚘</span> <span id="ui-commute-title">出行路线与成本估算器 (Bus & Drive)</span>
    </h2>
    <div class="flex flex-col sm:flex-row gap-3 items-end">
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="ui-commute-label">输入你的出发地点（例如：Athena Dr, North Shore / Auckland CBD）：</label>
        <input type="text" id="originInput" placeholder="e.g. Athena Drive, Albany / Takapuna / City Center" class="w-full p-2 border border-gray-200 rounded-lg text-xs">
      </div>
      <button onclick="calculateCommute()" class="w-full sm:w-auto bg-morandi-primary text-white px-4 py-2 rounded-lg text-xs hover:opacity-90 transition whitespace-nowrap">
        <span id="ui-commute-btn">计算预估时间与费用</span>
      </button>
    </div>
  </section>

  <!-- Filters Section -->
  <section class="max-w-6xl mx-auto bg-white p-4 rounded-xl card-shadow mb-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="fltr-area-lbl">地区</label>
        <select id="areaFilter" onchange="filterEvents()" class="w-full p-2 border border-gray-200 rounded-lg text-xs">
          <option value="ALL" id="opt-area-all">全部地区</option>
          <option value="North Shore" id="opt-area-ns">北岸 (North Shore)</option>
          <option value="CBD" id="opt-area-cbd">市中心 (CBD)</option>
          <option value="Central/West" id="opt-area-cw">中区/西区 (Central/West)</option>
          <option value="East/South" id="opt-area-es">东区/南区 (East/South)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="fltr-type-lbl">组织类型</label>
        <select id="typeFilter" onchange="filterEvents()" class="w-full p-2 border border-gray-200 rounded-lg text-xs">
          <option value="ALL" id="opt-type-all">全部类型</option>
          <option value="Library" id="opt-type-lib">图书馆</option>
          <option value="Official" id="opt-type-off">官方机构/大学</option>
          <option value="Church" id="opt-type-chu">教会</option>
          <option value="Community" id="opt-type-com">社区/公益组织</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="fltr-fee-lbl">费用模式</label>
        <select id="feeFilter" onchange="filterEvents()" class="w-full p-2 border border-gray-200 rounded-lg text-xs">
          <option value="ALL" id="opt-fee-all">全部费用</option>
          <option value="Free" id="opt-fee-free">完全免费</option>
          <option value="Donation" id="opt-fee-don">自愿捐助 ($2-$3)</option>
          <option value="Paid" id="opt-fee-paid">付费/测试免费</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="fltr-time-lbl">时间/时段</label>
        <select id="timeFilter" onchange="filterEvents()" class="w-full p-2 border border-gray-200 rounded-lg text-xs">
          <option value="ALL" id="opt-time-all">全部时间</option>
          <option value="WEEKDAY" id="opt-time-wkday">仅工作日 (Mon-Fri)</option>
          <option value="WEEKEND" id="opt-time-wkend">仅周末 (Sat-Sun)</option>
          <option value="Morning" id="opt-time-morn">上午场 (12:00前)</option>
          <option value="Afternoon" id="opt-time-aftn">下午场 (12:00-18:00)</option>
          <option value="Evening" id="opt-time-eve">晚间场 (18:00后)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1" id="fltr-srch-lbl">关键词</label>
        <input type="text" id="searchInput" oninput="filterEvents()" placeholder="Search..." class="w-full p-2 border border-gray-200 rounded-lg text-xs">
      </div>
    </div>
  </section>

  <!-- Timetable Content -->

  </main>

    let commuteEstimates = {};

    function calculateCommute() {
      const origin = document.getElementById('originInput').value.trim();
      if (!origin) {
        alert(currentLang === 'zh' ? '请输入出发地点' : 'Please enter a starting location.');
        return;
      }

      const isOriginNorthShore = origin.toLowerCase().includes('athena') || origin.toLowerCase().includes('north shore') || origin.toLowerCase().includes('albany') || origin.toLowerCase().includes('takapuna');
      
      coursesData.forEach((item, idx) => {
        let busMins = 30;
        let busFare = "$2.60 (1 Zone)";
        let driveMins = 15;
        let parkingFee = "Free Parking";

        if (isOriginNorthShore) {
          if (item.area === 'North Shore') {
            busMins = item.location.includes('Albany') || item.location.includes('Forrest') ? 15 : 25;
            busFare = "$2.60 (1 Zone)";
            driveMins = 10;
            parkingFee = item.location.includes('Takapuna') ? "$2.00/hr (Street)" : "Free Parking";
          } else if (item.area === 'CBD') {
            busMins = 35;
            busFare = "$4.45 (2 Zones)";
            driveMins = 20;
            parkingFee = "$4.00–$6.00/hr (City Parking)";
          } else {
            busMins = 55;
            busFare = "$6.00 (3 Zones)";
            driveMins = 30;
            parkingFee = "Free / On-site";
          }
        } else {
          busMins = item.area === 'CBD' ? 20 : 40;
          busFare = item.area === 'CBD' ? "$2.60" : "$4.45";
          driveMins = item.area === 'CBD' ? 15 : 25;
          parkingFee = item.area === 'CBD' ? "$5.00/hr" : "Free Parking";
        }

        commuteEstimates[idx] = { 
          busMins: busMins, 
          busFare: busFare,
          driveMins: driveMins,
          parkingFee: parkingFee
        };
      });

      filterEvents();
    }

    const daysOrder = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];

    function getTypeName(type) {
      switch(type) {
        case 'Library': return currentLang === 'zh' ? '📚 图书馆' : '📚 Library';
        case 'Official': return currentLang === 'zh' ? '🏛️ 官方/机构' : '🏛️ Official';
        case 'Church': return currentLang === 'zh' ? '⛪ 教会' : '⛪ Church';
        case 'Community': return currentLang === 'zh' ? '🤝 社区/公益' : '🤝 Community';
        default: return type;
      }
    }

    function getTypeBadgeClass(type) {
      switch(type) {
        case 'Library': return 'bg-morandi-blue text-white';
        case 'Official': return 'bg-morandi-purple text-white';
        case 'Church': return 'bg-morandi-accent text-white';
        case 'Community': return 'bg-morandi-primary text-white';
        default: return 'bg-gray-400 text-white';
      }
    }

    function getFeeBadge(fee) {
      if (fee === 'Free') return `<span class="border border-green-600 text-green-700 text-xs px-1.5 py-0.5 rounded">${currentLang === 'zh' ? '免费' : 'Free'}</span>`;
      if (fee === 'Donation') return `<span class="border border-amber-600 text-amber-700 text-xs px-1.5 py-0.5 rounded">${currentLang === 'zh' ? '自愿捐助' : 'Donation'}</span>`;
      return `<span class="border border-red-400 text-red-600 text-xs px-1.5 py-0.5 rounded">${currentLang === 'zh' ? '付费/测试免费' : 'Paid/Test'}</span>`;
    }

    function renderTimetable(data) {
      const container = document.getElementById('timetableContainer');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-500">${currentLang === 'zh' ? '没有找到符合条件的英语活动' : 'No matching events found.'}</div>`;
        return;
      }

      daysOrder.forEach(dayName => {
        const dayEvents = data.filter(item => item.dayName === dayName);
        if (dayEvents.length === 0) return;

        // Ensure each day column has a sensible minimum width so its inner cards never overflow.
        // Tailwind arbitrary value `min-w-[250px]` sets a 250px floor, and it works responsively.
        const dayWrapper = document.createElement('div');
        // Minimum width increased to avoid inner content overflow on larger screens.
        dayWrapper.className = 'bg-white rounded-xl p-5 card-shadow min-w-[350px]';

        const displayDayName = currentLang === 'zh' ? dayName : dayEvents[0].dayNameEn;

        let html = `<h2 class="text-xl font-bold text-morandi-primary mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
                      <span>${displayDayName}</span>
                      <span class="text-xs bg-morandi-bg text-gray-600 font-normal px-2 py-0.5 rounded-full">${dayEvents.length} ${currentLang === 'zh' ? '场活动' : 'events'}</span>
                    </h2>`;

        const periods = [
          { key: 'Morning', title: i18n[currentLang].mornTitle, bg: 'bg-morandi-morning/40', border: 'border-blue-200' },
          { key: 'Afternoon', title: i18n[currentLang].aftnTitle, bg: 'bg-morandi-afternoon/40', border: 'border-amber-200' },
          { key: 'Evening', title: i18n[currentLang].eveTitle, bg: 'bg-morandi-evening/40', border: 'border-purple-200' }
        ];

        periods.forEach(p => {
          const pEvents = dayEvents.filter(e => e.period === p.key);
          if (pEvents.length === 0) return;

          html += `
            <div class="mb-5 last:mb-0">
              <div class="text-xs font-bold text-gray-500 mb-2 flex items-center gap-1">
                <span>${p.title}</span>
              </div>
              <div class="space-y-3">
          `;

          pEvents.forEach(evt => {
            const originalIndex = coursesData.indexOf(evt);
            const commuteInfo = commuteEstimates[originalIndex];

            let commuteTag = '';
            if (commuteInfo) {
              commuteTag = `<div class="w-full flex flex-wrap gap-2 mt-1">
                              <span class="bg-amber-50 text-amber-900 text-xs px-2 py-0.5 rounded border border-amber-200">
                                🚌 Bus ~${commuteInfo.busMins} mins | ${commuteInfo.busFare}
                              </span>
                              <span class="bg-blue-50 text-blue-900 text-xs px-2 py-0.5 rounded border border-blue-200">
                                🚗 Drive ~${commuteInfo.driveMins} mins | Park: ${commuteInfo.parkingFee}
                              </span>
                            </div>`;
            }

            const titleToDisplay = currentLang === 'zh' ? evt.title : evt.titleEn;
            const areaToDisplay = currentLang === 'zh' ? evt.area : evt.areaEn;
            const noteToDisplay = currentLang === 'zh' ? evt.note : evt.noteEn;

            html += `
              <div class="p-3.5 rounded-lg border ${p.border} ${p.bg} transition hover:shadow-sm">
                <div class="flex flex-wrap justify-between items-start gap-2 mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-sm text-gray-800">${evt.time}</span>
                    <span class="text-xs ${getTypeBadgeClass(evt.type)} px-2 py-0.5 rounded font-medium">${getTypeName(evt.type)}</span>
                    ${getFeeBadge(evt.fee)}
                  </div>
                  <span class="text-xs font-semibold text-gray-500 bg-white/80 px-2 py-0.5 rounded">📍 ${areaToDisplay}</span>
                </div>
                
                <h3 class="font-bold text-base text-gray-800 mb-1">${titleToDisplay}</h3>
                <p class="text-xs text-gray-600 mb-1">📍 ${evt.location}</p>
                <p class="text-xs text-gray-500 bg-white/70 p-2 rounded border border-gray-100/50">💡 ${noteToDisplay}</p>
                ${commuteTag}
              </div>
            `;
          });

          html += `</div></div>`;
        });

        dayWrapper.innerHTML = html;
        container.appendChild(dayWrapper);
      });
    }

    function renderIcebreakers() {
      const container = document.getElementById('icebreakerCards');
      container.innerHTML = '';

      icebreakersData.forEach(item => {
        const title = currentLang === 'zh' ? item.categoryZh : item.categoryEn;
        const list = currentLang === 'zh' ? item.phrasesZh : item.phrasesEn;

        let cardHtml = `
          <div class="bg-morandi-bg/40 p-4 rounded-lg border border-gray-200 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-sm text-morandi-primary mb-3 border-b pb-1 border-gray-200">${title}</h3>
              <div class="space-y-3">
        `;

        list.forEach(p => {
          cardHtml += `
            <div>
              <div class="text-xs font-semibold text-morandi-accent mb-0.5">[${p.label}]</div>
              <div class="text-xs font-bold text-gray-800 bg-white p-2 rounded border border-gray-100">"${p.phrase}"</div>
              <div class="text-[11px] text-gray-500 mt-1 italic">💡 ${p.tip}</div>
            </div>
          `;
        });

        cardHtml += `</div></div></div>`;
        container.innerHTML += cardHtml;
      });
    }

    function filterEvents() {
      const area = document.getElementById('areaFilter').value;
      const type = document.getElementById('typeFilter').value;
      const fee = document.getElementById('feeFilter').value;
      const time = document.getElementById('timeFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = coursesData.filter(item => {
        const matchArea = (area === 'ALL' || item.area === area);
        const matchType = (type === 'ALL' || item.type === type);
        const matchFee = (fee === 'ALL' || item.fee === fee);
        
        let matchTime = true;
        if (time === 'WEEKDAY') matchTime = item.isWeekday;
        else if (time === 'WEEKEND') matchTime = !item.isWeekday;
        else if (time !== 'ALL') matchTime = (item.period === time);

        const matchSearch = item.title.toLowerCase().includes(search) || 
                            item.titleEn.toLowerCase().includes(search) || 
                            item.location.toLowerCase().includes(search) || 
                            item.note.toLowerCase().includes(search) ||
                            item.noteEn.toLowerCase().includes(search);

        return matchArea && matchType && matchFee && matchTime && matchSearch;
      });

      renderTimetable(filtered);
    }

    function exportToICS() {
      let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Auckland English Hub//CN\n";
      coursesData.forEach(item => {
        icsContent += "BEGIN:VEVENT\n";
        icsContent += `SUMMARY:[${getTypeName(item.type)}] ${item.titleEn}\n`;
        icsContent += `DESCRIPTION:${item.noteEn}\n`;
        icsContent += `LOCATION:${item.location}\n`;
        icsContent += "END:VEVENT\n";
      });
      icsContent += "END:VCALENDAR";

      const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', 'Auckland_English_Events.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function exportToImage() {
      html2canvas(document.getElementById('timetableContainer')).then(canvas => {
        const link = document.createElement('a');
        link.download = 'Auckland_English_Timetable.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    function exportToPDF() {
      const { jsPDF } = window.jspdf;
      html2canvas(document.getElementById('timetableContainer')).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgProps = pdf.getImageProperties(imgData);
        const pdfWidth = pdf.internal.pageSize.getWidth();
        const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
        pdf.save('Auckland_English_Timetable.pdf');
      });
    }

    // Initialize
    renderTimetable(coursesData);
    renderIcebreakers();
  </script>
